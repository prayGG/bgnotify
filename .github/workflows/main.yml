name: bot-run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The forum scraper hits thinksteroids only every `check_interval_minutes`
      # (2h by default). On the other ~11 of 12 cron runs the Playwright
      # install + cache restore would just burn ~20s for nothing — so we skip
      # them when state.json says the next forum visit isn't due yet.
      - name: Check if forum is due
        id: forum
        run: |
          python <<'PY' >> "$GITHUB_OUTPUT"
          import json, yaml
          from datetime import datetime, timezone
          try:
              cfg = yaml.safe_load(open("config.yml", encoding="utf-8")) or {}
              interval = int((cfg.get("forum") or {}).get("check_interval_minutes", 120))
          except Exception:
              interval = 120
          due = True
          try:
              state = json.load(open("state.json", encoding="utf-8"))
              last = (state.get("forum") or {}).get("last_check_at", "")
              if last:
                  dt = datetime.fromisoformat(last.replace("Z", "+00:00"))
                  elapsed = (datetime.now(timezone.utc) - dt).total_seconds()
                  due = elapsed >= interval * 60
          except (OSError, ValueError, KeyError):
              pass
          print(f"due={'yes' if due else 'no'}")
          PY

      # Cache the ~150 MB Chromium binary across runs. Key on requirements.txt
      # so an upgrade re-downloads matching browser builds automatically.
      # Unconditional now: both the forum scraper AND the order-status login
      # need a real browser. The order check self-gates by interval in code,
      # so the binary is present but only actually driven when due.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # No --with-deps: ubuntu-latest has every shared lib Playwright needs
      # pre-installed; the only "missing" packages with --with-deps were
      # emoji/CJK fonts, which we don't need for HTML-only scraping.
      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Run Bot
        run: python -m src.main
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_STOCK_WEBHOOK_URL: ${{ secrets.DISCORD_STOCK_WEBHOOK_URL }}
          DISCORD_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          PING_USER_IDS: "${{ secrets.DISCORDID }},${{ secrets.WEITERE_ID_HIER }}"
          # Bestellstatus aus dem BG-Kundenkonto (leer = Feature inaktiv)
          DISCORD_ORDER_WEBHOOK_URL: ${{ secrets.DISCORD_ORDER_WEBHOOK_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # Konto a
          BG_USERNAME: ${{ secrets.BG_USERNAME }}
          BG_PASSWORD: ${{ secrets.BG_PASSWORD }}
          DISCORDID: ${{ secrets.DISCORDID }}
          # Konto b (leer/abwesend = wird einfach übersprungen)
          BG_USERNAME_2: ${{ secrets.BG_USERNAME_2 }}
          BG_PASSWORD_2: ${{ secrets.BG_PASSWORD_2 }}
          WEITERE_ID_HIER: ${{ secrets.WEITERE_ID_HIER }}

      - name: Commit & Push state
        run: |
          git config --global user.name "bgnotify-bot"
          git config --global user.email "bot@users.noreply.github.com"

          # Sync to latest origin without rebasing the bot's just-written state.
          # Save state.json aside, hard-reset (gets any code commits), restore.
          # Avoids merge conflicts entirely — the bot's freshly computed state
          # is always the source of truth.
          cp state.json /tmp/bot-state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/bot-state.json state.json

          if git diff --quiet HEAD -- state.json; then
            echo "Keine Änderungen an state.json"
            exit 0
          fi

          git add state.json
          git commit -m "update state"
          git push origin main
