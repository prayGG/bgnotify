name: bot-run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # Volle History nötig: deploy.py (announce_deploy) prüft per
      # `git cat-file -e <last_deploy_sha>`, ob der zuletzt angekündigte
      # Commit erreichbar ist, und filtert dann die "update state"-Commits
      # aus prev..HEAD. Mit einem flachen Klon ist last_sha unerreichbar →
      # HEAD-only-Fallback feuert "update state" als Deploy bei jedem Lauf.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # Der Bot committet jeden Lauf eine neue state.json — inzwischen >10.000
          # Commits, Tendenz +145/Tag. `fetch-depth: 0` bräuchte davon jede einzelne
          # Dateiversion. Mit dem Blob-Filter kommt nur der Commit-Graph (den
          # deploy.py braucht), Dateiinhalte holt git bei Bedarf nach. Hält den
          # Checkout konstant schnell, statt mit der History mitzuwachsen.
          filter: blob:none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Browser-Cache. Key on requirements.txt so an upgrade re-downloads matching
      # browser builds automatically. Unconditional: both the forum scraper AND
      # der Order-Login brauchen einen echten Browser. Die Checks takten sich im
      # Code selbst, das Binary liegt also bereit, fährt aber nur wenn fällig.
      #
      # Das `-shell` im Key ist Absicht: es entwertet den alten, doppelt so großen
      # Cache (siehe nächster Step), sonst würde der weiter restauriert.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # NUR die Headless-Shell, nicht das komplette Chromium.
      #
      # `playwright install chromium` zieht seit 1.49 DREI Pakete: chromium (320 MB),
      # chromium-headless-shell (192 MB) und ffmpeg. Nachgemessen mit DEBUG=pw:browser
      # startet `p.chromium.launch(headless=True)` aber immer headless_shell — das
      # volle Chromium lag also nur im Cache herum und wurde bei jedem Lauf mit
      # entpackt, ohne je zu laufen. Identisches Verhalten, halber Cache.
      #
      # Kein --with-deps: ubuntu-latest hat alle nötigen shared libs vorinstalliert;
      # die einzigen "fehlenden" Pakete wären Emoji-/CJK-Fonts, die wir fürs
      # reine HTML-Scrapen nicht brauchen.
      # Nur bei Cache-Miss — bei Hit wäre der Step reine Wartezeit.
      - name: Install Playwright Chromium (headless shell)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium-headless-shell

      - name: Run Bot
        run: python -m src.main
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_STOCK_WEBHOOK_URL: ${{ secrets.DISCORD_STOCK_WEBHOOK_URL }}
          DISCORD_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
          PING_USER_IDS: "${{ secrets.DISCORDID }},${{ secrets.WEITERE_ID_HIER }}"
          # Bestellstatus aus dem BG-Kundenkonto (leer = Feature inaktiv)
          DISCORD_ORDER_WEBHOOK_URL: ${{ secrets.DISCORD_ORDER_WEBHOOK_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # Konto a
          BG_USERNAME: ${{ secrets.BG_USERNAME }}
          BG_PASSWORD: ${{ secrets.BG_PASSWORD }}
          DISCORDID: ${{ secrets.DISCORDID }}
          # Konto b (leer/abwesend = wird einfach übersprungen)
          BG_USERNAME_2: ${{ secrets.BG_USERNAME_2 }}
          BG_PASSWORD_2: ${{ secrets.BG_PASSWORD_2 }}
          WEITERE_ID_HIER: ${{ secrets.WEITERE_ID_HIER }}

      # Läuft auch bei rotem Bot-Run: bei einem Crash schreibt main.py den
      # State (inkl. Fehler-Report-Fingerprint) trotzdem — ohne Commit würde
      # ein Crash-Loop bei jedem Lauf denselben Discord-Alarm feuern.
      - name: Commit & Push state
        if: ${{ success() || failure() }}
        run: |
          # Die Mail bestimmt, welchem GitHub-Account die Commits zugeordnet werden
          # — und zwar über den Nutzernamen davor. "bot@users.noreply.github.com"
          # landete deshalb beim Account `bot` (id 58210622), einem Fremden, der
          # mit dem Repo nichts zu tun hat. Davor tat es "bot@bot.com" bei
          # BunnyRunnerX. Beide hatten nie Zugriff, es ist reine Anzeige — aber die
          # History soll nicht an fremden Profilen hängen.
          #
          # 41898282 ist der offizielle GitHub-Actions-Bot: kann niemandem gehören,
          # niemand kann ihn sich später registrieren. Der Anzeigename bleibt
          # "bgnotify-bot", damit `git log` lesbar bleibt.
          git config --global user.name "bgnotify-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sync to latest origin without rebasing the bot's just-written state.
          # Save state.json aside, hard-reset (gets any code commits), restore.
          # Avoids merge conflicts entirely — the bot's freshly computed state
          # is always the source of truth.
          cp state.json /tmp/bot-state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/bot-state.json state.json

          if git diff --quiet HEAD -- state.json; then
            echo "Keine Änderungen an state.json"
            exit 0
          fi

          git add state.json
          git commit -m "update state"
          git push origin main
