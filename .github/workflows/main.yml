name: bot-run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        run: python -m src.main
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}

      - name: Commit & Push state
        run: |
          git config --global user.name "bgnotify-bot"
          git config --global user.email "bot@users.noreply.github.com"

          # Sync to latest origin without rebasing the bot's just-written state.
          # Save state.json aside, hard-reset (gets any code commits), restore.
          # Avoids merge conflicts entirely — the bot's freshly computed state
          # is always the source of truth.
          cp state.json /tmp/bot-state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/bot-state.json state.json

          if git diff --quiet HEAD -- state.json; then
            echo "Keine Änderungen an state.json"
            exit 0
          fi

          git add state.json
          git commit -m "update state"
          git push origin main
