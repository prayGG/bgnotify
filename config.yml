discord_webhook_env: DISCORD_WEBHOOK_URL

# Stock-Alerts (Restock + neue Out-of-stock-Meldungen) gehen in einen eigenen
# Channel (bg-notify). Restocks pingen, OOS nicht. Wenn die env var leer ist,
# fällt der Bot auf den Haupt-Webhook zurück — damit Restock-Alerts auch ohne
# das neue Secret weiter funktionieren.
discord_stock_webhook_env: DISCORD_STOCK_WEBHOOK_URL

# Eigener Webhook für BG's Forum-Posts auf thinksteroids.com. Lautlos (kein
# @-Mention) — landet in einem dedizierten Channel. Wenn die env var leer
# ist, wird der Forum-Check übersprungen.
discord_forum_webhook_env: DISCORD_FORUM_WEBHOOK_URL

forum:
  # Saved-search URL für BG's Posts. Wird intern auf o=date umgebogen, damit
  # neueste oben stehen. Falls die URL irgendwann nicht mehr geht, kann auch
  # eine frische Suche von thinksteroids.com hier rein.
  search_url: "https://thinksteroids.com/community/search/2728764/?c[users]=BG+pharmaceuticals&o=relevance"
  # Defensiver Filter — XenForo ignoriert unbekannte User-Filter lautlos,
  # ohne diesen Check würden wir bei kaputter URL alle Posts spammen.
  author: "BG pharmaceuticals"
  # Max neue Posts pro Run die wirklich gepostet werden. Bei längerem Ausfall
  # vermeidet das einen riesigen Burst — ältere fallen einfach weg.
  max_per_run: 5
  # Forum wird nur alle N Minuten gescraped, egal wie oft der Bot insgesamt
  # läuft. Polite für Incapsula — Headless-Chrome ist teurer + auffälliger als
  # ein Stock-Check, deshalb großzügiger Abstand.
  check_interval_minutes: 120

# Bestellstatus aus dem BG-Kundenkonto. Login nur alle N Minuten (höflich +
# unauffällig — Bestellungen bewegen sich über Stunden, nicht Minuten). Der
# Login-Zeitpunkt wird zusätzlich um ±10% gejittert (kein exaktes Muster).
# Hermes-Sendungsverfolgung. Findet der Bestell-Watcher bei einer Bestellung
# einen Tracking-Link, trägt er ihn selbst ins private Gist (`auto_tracking`)
# und meldet ab dann jede Station einzeln. Zusätzlich können Links von Hand
# unter `manual_tracking` stehen (nur im PRIVATEN Gist, nie hier — das Repo ist
# öffentlich), für Pakete, deren Kundenkonto der Bot nicht hat.
# Takt = Abstand zwischen zwei Abfragen DERSELBEN Sendung.
#
# ACHTUNG, das Raster: Der Bot läuft alle 10 Minuten, öfter als das kann keine
# Sendung abgefragt werden. Der ±10%-Jitter entscheidet also nur, BEI WELCHEM
# Lauf sie drankommt — gemessen über 2000 Durchläufe:
#
#     60 → 60 oder 70 min     15 → immer 20 min
#     30 → 30 oder 40 min      9 → immer 10 min, also jeder Lauf
#
# Jeder Wert zwischen 10 und 20 ergibt dieselben 20 Minuten, das Raster
# schluckt den Unterschied. 9 ist der schnellstmögliche Wert: Die Schwelle
# bleibt mit 8,1–9,9 min immer unter 10, damit ist jede Sendung bei jedem Lauf
# fällig. Kleiner als 9 ändert nichts mehr.
#
# Preis dafür: Jede Abfrage startet einen eigenen Browser (~10 s), bei zwei
# Paketen also ~20 s Laufzeit zusätzlich pro Lauf. Ein Rate-Limit droht kaum —
# die Sendungsseite ist öffentlich, und jeder Lauf kommt von einem frischen
# Runner mit neuer IP, aus Hermes' Sicht macht also jede IP genau einen Aufruf.
tracking:
  check_interval_minutes: 9
  # Sendungen pro Lauf. Bei zwei Paketen gleichzeitig würde sonst jedes nur
  # jeden zweiten Lauf drankommen und der Takt sich still verdoppeln.
  max_per_run: 2

orders:
  # Takt bei OFFENER Bestellung (schnell genug für Statuswechsel + Tracking).
  check_interval_minutes: 240
  # Ruhe-Takt wenn nichts offen ist (alles completed/cancelled) — nur um neue
  # Bestellungen zu entdecken. ~1× täglich; spart Logins wenn man nicht bestellt.
  idle_interval_minutes: 1440
  # Mehrere BG-Konten. Hier stehen NUR die Namen der GitHub-Secrets — nie die
  # Werte selbst (Repo ist öffentlich). Pro Bot-Lauf wird höchstens EIN Konto
  # eingeloggt (Staggering), nie zwei gleichzeitig von derselben IP.
  # Ein Konto wird übersprungen, solange seine Secrets nicht existieren.
  # `label` ist reine Anzeige: steht als Titel auf den Bestell-/Tracking-Karten
  # ("pray · #10042" statt nur "#10042"), damit im gemeinsamen Channel sofort
  # klar ist, wessen Bestellung das ist. Weglassen = wie vorher nur die Nummer.
  accounts:
    - name: a
      label: pray
      username_env: BG_USERNAME
      password_env: BG_PASSWORD
      ping_env: DISCORDID            # Secret mit der Discord-User-ID für Konto a
    - name: b
      label: mave
      username_env: BG_USERNAME_2
      password_env: BG_PASSWORD_2
      ping_env: WEITERE_ID_HIER      # bestehendes Secret mit der Discord-ID für Konto b

notifications:
  # Discord User-IDs werden bei Restocks gepingt. Damit die IDs NICHT im
  # public Repo stehen, kommen sie über env var `PING_USER_IDS`
  # (komma-/semicolon-/space-separiert), die der Workflow aus GitHub
  # Secrets baut. Für lokales Dev kannst du hier weiterhin Werte eintragen
  # — die env var hat Vorrang.
  # ping_user_ids:
  #   - "DEINE_ID_HIER"

  # Optional: ganze Discord-Rollen pingen (Rechtsklick auf Rolle → ID kopieren).
  # ping_role_ids:
  #   - "ROLLEN_ID"

products:
  - name: "GHK CU"
    url: "https://bgpharmadrugs.to/product/peptides/"
    emoji: "🧪"
    watch_variants:
      - "GHK CU 50 mg"

  - name: "Tirzepatide"
    url: "https://bgpharmadrugs.to/product/peptides/"
    emoji: "🧪"
    watch_variants:
      - "Tirzepatide 30 mg"

  - name: "Retatrutide"
    url: "https://bgpharmadrugs.to/product/peptides/"
    emoji: "🧪"
    watch_variants:
      - "Retatrutide 30 mg"

  - name: "BPC157/TB500 Mix"
    url: "https://bgpharmadrugs.to/product/peptides/"
    emoji: "🧪"
    watch_variants:
      - "BPC157/TB500 mix 5mg each"
    # Anzeige-Alias (variable product → Match-String roh lassen).
    variant_labels:
      "BPC157/TB500 mix 5mg each": "BPC/TB500 5 mg"

  - name: "Modafinil"
    url: "https://bgpharmadrugs.to/product/modafinil/"
    emoji: "💊"
    watch_variants:
      - "ASPENDOS tablets 100 mg * 30 Medochemie"
    # Anzeige-Alias: Modafinil ist ein variable product, der watch_variant
    # MUSS exakt das Website-Variantenlabel treffen — daher bleibt der
    # Match-String roh und nur die Anzeige (Dashboard/Stats/Alerts) wird
    # umbenannt. Key = exakter watch_variant.
    variant_labels:
      "ASPENDOS tablets 100 mg * 30 Medochemie": "Modafinil 100 mg 30x"

  - name: "Roaccutane 20 mg (Roche)"
    url: "https://bgpharmadrugs.to/product/roaccutane-20-mg-30-roche/"
    watch_variants:
      - "Roaccutane 20 mg 30 Roche"
    # Anzeige-Alias: watch_variant bleibt roh (Match + state.json-Key), nur
    # die Anzeige (Dashboard/Stats/Alerts) wird ohne "Roche" gezeigt.
    variant_labels:
      "Roaccutane 20 mg 30 Roche": "Roaccutane 20 mg 30x"

  - name: "Minoxidil 5 mg"
    emoji: "💊"
    # War früher ein Combined-Produkt aus zwei Quellen; die zweite
    # (minoxidil-5-mg-100-sigma-audley) liefert seit Juni 2026 dauerhaft 404
    # (Produktseite entfernt) und hat in jedem Lauf einen Fehler-Report
    # ausgelöst. Jetzt nur noch die lebende minoxytop-Quelle.
    url: "https://bgpharmadrugs.to/product/minoxytop-5-mg-minoxidil-tablets-ip/"
    watch_variants:
      - "Minoxidil 5 mg"

  - name: "Tretinoin"
    url: "https://bgpharmadrugs.to/product/tretinoin/"
    emoji: "✨"
    # Variable product mit zwei Optionen. Die Dropdown-Labels enthalten kein
    # "Tretinoin", daher bleibt der watch_variant roh (exakter Match-String +
    # state.json-Key) und nur die Anzeige bekommt einen lesbaren Alias.
    watch_variants:
      - "0.025% 20 grams"
      - "0.05% 30 grams"
    variant_labels:
      "0.025% 20 grams": "Tretinoin 0.025% 20g"
      "0.05% 30 grams": "Tretinoin 0.05% 30g"
